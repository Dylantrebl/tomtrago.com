development:
  adapter: async

test:
  adapter: async

production:
  adapter: redis
  # Default allows asset precompile during build when REDIS_URL isn't set yet; set REDIS_URL in production (e.g. Heroku Redis add-on).
  url: <%= ENV.fetch("REDIS_URL", "redis://localhost:6379/1") %>
  channel_prefix: tomtrago_production
